[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "datapack-engine"
version = "0.1.0"
description = "Python bindings for the DataPack lossless compression engine"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["DATAPACK-LICENSE-MIT"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Gom-svg/Datapack"

[tool.maturin]
bindings = "pyo3"
module-name = "datapack._native"
python-source = "python"
strip = true

[tool.maturin.sbom]
# Maturin's generated Rust SBOM records absolute path-dependency locations.
# Keep it out of distributable wheels until those paths can be sanitized.
rust = false
auditwheel = false
