[package]
name = "datapack-python"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Thin PyO3 bindings for the DataPack Rust application API"
license = "MIT"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
datapack = { path = ".." }
pyo3 = { version = "=0.29.0", features = ["abi3-py39", "extension-module"] }
serde = "1.0"
serde_json = "1.0"
