[package]
name = "datapack"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Structure-aware, byte-exact compression and archive engine for structured text data"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Gom-svg/Datapack"
keywords = ["compression", "csv", "archive", "lossless", "cli"]
categories = ["command-line-utilities", "compression", "encoding"]

[dependencies]
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
zstd = { version = "0.13", features = ["zstdmt"] }

[dev-dependencies]
tempfile = "3.10"

[[bench]]
name = "performance_regression"
path = "benches/performance_regression.rs"
harness = false
test = false
