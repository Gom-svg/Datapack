name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust 1.85 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install the certified Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Report toolchain
        run: rustc --version && cargo --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check crate
        run: cargo check --locked
      - name: Run tests
        run: cargo test --locked
      - name: Run strict Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  python:
    name: Python SDK foundation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install the certified Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Install Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install maturin
        run: python -m pip install "maturin==1.14.1"
      - name: Check product identity and version consistency
        run: python scripts/check_version_consistency.py
      - name: Check binding formatting
        run: cargo fmt --manifest-path python/Cargo.toml --check
      - name: Check binding crate
        run: cargo check --manifest-path python/Cargo.toml --locked
      - name: Run binding test build
        run: cargo test --manifest-path python/Cargo.toml --locked
      - name: Run strict binding Clippy
        run: cargo clippy --manifest-path python/Cargo.toml --all-targets --locked -- -D warnings
      - name: Build wheel
        run: maturin build --manifest-path python/Cargo.toml --release --locked --interpreter python --out python/dist
      - name: Install wheel
        run: python -m pip install --force-reinstall python/dist/*.whl
      - name: Run installed-package tests
        run: python -m unittest discover -s python/tests -v

  python-wheel-build:
    name: Python wheel build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GNU x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            interpreter: python3.14
            platform: linux
            artifact: datapack-python-wheel-linux-x86_64
            docker-options: -e RUSTFLAGS
            auditwheel_args: --auditwheel check
          - name: Windows MSVC x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "off"
            interpreter: python
            platform: windows
            artifact: datapack-python-wheel-windows-x86_64
            docker-options: ""
            auditwheel_args: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install the certified Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Install Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Remap Linux build paths
        if: runner.os == 'Linux'
        shell: bash
        run: echo "RUSTFLAGS=--remap-path-prefix=/io=datapack-src --remap-path-prefix=/root=build-home" >> "$GITHUB_ENV"
      - name: Remap Windows build paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"RUSTFLAGS=--remap-path-prefix=$env:GITHUB_WORKSPACE=datapack-src --remap-path-prefix=$env:USERPROFILE=build-home" | Out-File -FilePath $env:GITHUB_ENV -Append'
      - name: Build release ABI3 wheel
        uses: PyO3/maturin-action@3e2bdf6ba6453a61e649744019b8a2d906c7eb38 # v1.51.0
        with:
          command: build
          maturin-version: v1.14.1
          rust-toolchain: 1.85.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          docker-options: ${{ matrix.docker-options }}
          args: >-
            --release
            --locked
            --strip
            ${{ matrix.auditwheel_args }}
            --interpreter ${{ matrix.interpreter }}
            --manifest-path python/Cargo.toml
            --out python/dist
      - name: Inspect wheel identity, tags, metadata, and contents
        run: >-
          python scripts/certify_python_wheel.py
          --wheel-dir python/dist
          --platform ${{ matrix.platform }}
          --inspect-only
      - name: Upload CI wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  python-wheel-test:
    name: Python wheel (${{ matrix.platform }}, CPython ${{ matrix.python-version }})
    needs: python-wheel-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: datapack-python-wheel-linux-x86_64
          - os: windows-latest
            platform: windows
            artifact: datapack-python-wheel-windows-x86_64
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install matrix Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download the platform wheel built once
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: python/dist
      - name: Certify isolated wheel installation and public SDK
        run: >-
          python scripts/certify_python_wheel.py
          --wheel-dir python/dist
          --platform ${{ matrix.platform }}

  policy-and-package:
    name: Dependency policy and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install the certified Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.85.0"
          command: check
      - name: Check Python binding dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.85.0"
          manifest-path: ./python/Cargo.toml
          command: check
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1
      - name: Audit core dependencies
        run: cargo audit
      - name: Audit Python binding dependencies
        run: cargo audit --file python/Cargo.lock
      - name: Verify crate package
        run: cargo package --locked
